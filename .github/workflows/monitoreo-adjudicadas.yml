name: Monitoreo de adjudicadas

# Barrido diario de adjudicaciones de Mercado Público en el rubro RCH.
# Detecta las nuevas, actualiza data/adjudicadas.json (commit de vuelta) y,
# si hay novedades y el correo está configurado, envía un aviso.

on:
  schedule:
    # 12:00 UTC ≈ 08:00/09:00 Chile continental (según horario de verano).
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Permite ejecutarlo a mano desde la pestaña Actions.
    inputs:
      dias_atras:
        description: "Días hacia atrás a barrer"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: monitoreo-adjudicadas
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar barrido
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          DIAS_ATRAS: ${{ github.event.inputs.dias_atras || '2' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor_diario.py

      - name: Persistir histórico de adjudicadas
        run: |
          if [ -n "$(git status --porcelain data/adjudicadas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/adjudicadas.json
            git commit -m "chore: actualiza histórico de adjudicadas [skip ci]"
            git push
          else
            echo "Sin cambios en el histórico de adjudicadas."
          fi
